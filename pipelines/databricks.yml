bundle:
  name: incident-copilot

variables:
  catalog:
    description: Unity Catalog catalog (Free Edition default is "workspace")
    default: workspace
  schema:
    description: Schema holding all bronze/silver/gold tables
    default: incident_copilot
  warehouse_id:
    description: SQL warehouse for SQL tasks
    default: 1ace299486bf57e9

include:
  - resources/*.yml

targets:
  dev:
    default: true
