[project]
name = "routing-ml"
version = "0.1.0"
description = "Assignment-group routing model: training, evaluation vs Claude, MLflow registration"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "databricks-sdk>=0.143.0",
    "mlflow>=3.1",
    "pandas>=2.2",
    # Must match the version pinned in apps/api: the API unpickles this model.
    "scikit-learn==1.8.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"routing/llm.py" = ["E501"]  # prompt prose

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
