[project]
name = "incident-copilot-api"
version = "0.1.0"
description = "Backend API for Incident Intelligence Copilot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "databricks-sdk>=0.143.0",
    "mlflow-skinny>=3.1",
    "scikit-learn==1.8.0",
    "pandas>=2.2",
    "skops>=0.16.0",
    "anthropic>=1.9",
    "python-multipart>=0.0.20",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=3.0.5.260914",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Prompt and tool-description prose reads better unwrapped.
"app/agent/prompt.py" = ["E501"]
"app/agent/tools.py" = ["E501"]
"app/services/summary.py" = ["E501"]
"app/services/knowledge.py" = ["E501"]
"app/services/reviews.py" = ["E501"]
"app/services/intake.py" = ["E501"]
"app/services/intake_chat.py" = ["E501"]
"app/services/tickets.py" = ["E501"]  # work-note prose

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
