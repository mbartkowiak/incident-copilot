[project]
name = "incident-copilot-api"
version = "0.1.0"
description = "Backend API for Incident Intelligence Copilot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "databricks-sdk>=0.143.0",
    "mlflow-skinny>=3.1",
    "scikit-learn==1.8.0",
    "pandas>=2.2",
    "skops>=0.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=3.0.5.260914",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
